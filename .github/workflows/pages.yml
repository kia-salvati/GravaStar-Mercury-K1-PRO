# Builds the protocol package and the app, runs both test suites, and publishes apps/web/dist
# to GitHub Pages. The app is then installable from https://kia-salvati.github.io/GravaStar-Mercury-K1-PRO/
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=k916
      - run: npm test
      - run: npx vitest run
        working-directory: apps/web
      - run: npx vite build
        working-directory: apps/web
        env:
          BASE_PATH: /GravaStar-Mercury-K1-PRO/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
